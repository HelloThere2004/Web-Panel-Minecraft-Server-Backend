name: Deploy Backend Minecraft Server
on: 
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 211125563303.dkr.ecr.ap-southeast-1.amazonaws.com
            docker pull 211125563303.dkr.ecr.ap-southeast-1.amazonaws.com/minecraft-server-backend:latest
            docker stop minecraft-server-backend || true
            docker rm minecraft-server-backend || true
            docker run -d --name minecraft-server-backend \
              -p 3000:3000 \
              -v /home/ubuntu/minecraft_server:/minecraft_data \
              -e MC_SERVER_PATH=/minecraft_data \
              -e RCON_PORT=25575 \
              -e RCON_PASS=123456 \
              211125563303.dkr.ecr.ap-southeast-1.amazonaws.com/minecraft-server-backend:latest
